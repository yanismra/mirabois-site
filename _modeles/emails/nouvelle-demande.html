<div style="margin:0;padding:0;background:#ECE8E2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ECE8E2;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#FBFAF7;font-family:Helvetica,Arial,sans-serif;color:#2E2620;">
  <tr><td align="center" style="background:#2B211A;padding:24px 32px;">
    <img src="https://mirabois.fr/assets/img/logo-mirabois-clair.png" width="190" alt="Mirabois Construction" style="display:block;margin:0 auto;width:190px;height:auto;border:0;">
  </td></tr>
  <tr><td style="height:4px;background:#B0812C;font-size:0;line-height:0;">&nbsp;</td></tr>
  <tr><td style="padding:30px 32px 6px;">
    <p style="margin:0 0 6px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#B0812C;font-weight:bold;">Nouvelle demande de devis</p>
    <h1 style="margin:0;font-size:26px;line-height:1.2;font-weight:normal;color:#2B211A;">{{nom}}</h1>
  </td></tr>
  <tr><td style="padding:18px 32px 4px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#2B211A;">
      <tr><td style="padding:16px 20px;">
        <p style="margin:0 0 4px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#B0812C;font-weight:bold;">Budget indiqué par le client</p>
        <p style="margin:0;font-size:22px;color:#F3ECE0;font-weight:bold;">{{budget}}</p>
      </td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:16px 32px 6px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFFFFF;font-size:15px;line-height:1.5;">
      <tr><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;color:#6E655D;width:38%;">E-mail</td><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;"><a href="mailto:{{email}}" style="color:#2B211A;font-weight:bold;">{{email}}</a></td></tr>
      <tr><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;color:#6E655D;">Téléphone</td><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;color:#2B211A;font-weight:bold;">{{telephone}}</td></tr>
      <tr><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;color:#6E655D;">Commune</td><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;color:#2B211A;font-weight:bold;">{{commune}}</td></tr>
      <tr><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;color:#6E655D;">Neuf ou rénovation</td><td style="padding:12px 18px;border-bottom:1px solid #ECE8E2;color:#2B211A;font-weight:bold;">{{nature}}</td></tr>
      <tr><td style="padding:12px 18px;color:#6E655D;">Type de projet</td><td style="padding:12px 18px;color:#2B211A;font-weight:bold;">{{projet}}</td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:22px 32px 6px;">
    <p style="margin:0 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#593214;font-weight:bold;">Description du projet</p>
    <div style="background:#FFFFFF;border-left:4px solid #B0812C;padding:16px 18px;font-size:15px;line-height:1.6;white-space:pre-line;">{{message}}</div>
  </td></tr>
  <tr><td align="center" style="padding:28px 32px 34px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;"><tr>
      <td style="background:#B0812C;"><a href="mailto:{{email}}?subject=Votre%20projet%20%C2%B7%20Mirabois%20Construction" style="display:inline-block;padding:14px 26px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#2B211A;text-decoration:none;font-weight:bold;">Répondre au client</a></td>
    </tr></table>
  </td></tr>
</table>
</td></tr>
</table>
</div>
