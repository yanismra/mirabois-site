<div style="margin:0;padding:0;background:#ECE8E2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ECE8E2;">
<tr><td align="center" style="padding:20px 10px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#FBFAF7;font-family:Helvetica,Arial,sans-serif;color:#2E2620;">
  <tr><td style="padding:0;font-size:0;line-height:0;"><img src="https://mirabois.fr/assets/img/email/entete-fonce.png" width="600" alt="Mirabois Construction" style="display:block;width:100%;height:auto;border:0;"></td></tr>
  <tr><td style="height:4px;background:#B0812C;font-size:0;line-height:0;">&nbsp;</td></tr>
  <tr><td style="padding:26px 24px 4px;">
    <p style="margin:0 0 6px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#B0812C;font-weight:bold;">Nouvelle demande de devis</p>
    <h1 style="margin:0;font-size:25px;line-height:1.2;font-weight:normal;color:#2B211A;">{{nom}}</h1>
  </td></tr>
  <tr><td style="padding:16px 24px 4px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#2B211A;">
      <tr><td style="padding:14px 18px;">
        <p style="margin:0 0 4px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#B0812C;font-weight:bold;">Budget indiqué par le client</p>
        <p style="margin:0;font-size:21px;color:#F3ECE0;font-weight:bold;white-space:nowrap;">{{budget}}</p>
      </td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:14px 24px 4px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFFFFF;">
      <tr><td style="padding:12px 16px;border-bottom:1px solid #ECE8E2;">
        <p style="margin:0 0 3px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6E655D;">Téléphone</p>
        <p style="margin:0;font-size:17px;color:#2B211A;font-weight:bold;white-space:nowrap;">{{telephone}}</p>
      </td></tr>
      <tr><td style="padding:12px 16px;border-bottom:1px solid #ECE8E2;">
        <p style="margin:0 0 3px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6E655D;">E-mail</p>
        <p style="margin:0;font-size:16px;font-weight:bold;word-break:break-all;"><a href="mailto:{{email}}" style="color:#2B211A;">{{email}}</a></p>
      </td></tr>
      <tr><td style="padding:12px 16px;border-bottom:1px solid #ECE8E2;">
        <p style="margin:0 0 3px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6E655D;">Commune</p>
        <p style="margin:0;font-size:16px;color:#2B211A;font-weight:bold;">{{commune}}</p>
      </td></tr>
      <tr><td style="padding:12px 16px;border-bottom:1px solid #ECE8E2;">
        <p style="margin:0 0 3px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6E655D;">Neuf ou rénovation</p>
        <p style="margin:0;font-size:16px;color:#2B211A;font-weight:bold;">{{nature}}</p>
      </td></tr>
      <tr><td style="padding:12px 16px;">
        <p style="margin:0 0 3px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6E655D;">Type de projet</p>
        <p style="margin:0;font-size:16px;color:#2B211A;font-weight:bold;">{{projet}}</p>
      </td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:20px 24px 4px;">
    <p style="margin:0 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#593214;font-weight:bold;">Description du projet</p>
    <div style="background:#FFFFFF;border-left:4px solid #B0812C;padding:14px 16px;font-size:15px;line-height:1.6;white-space:pre-line;">{{message}}</div>
  </td></tr>
  <tr><td align="center" style="padding:26px 24px 30px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;"><tr>
      <td style="background:#B0812C;"><a href="mailto:{{email}}?subject=Votre%20projet%20%C2%B7%20Mirabois%20Construction" style="display:inline-block;padding:14px 26px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#2B211A;text-decoration:none;font-weight:bold;white-space:nowrap;">Répondre au client</a></td>
    </tr></table>
  </td></tr>
</table>
</td></tr>
</table>
</div>
